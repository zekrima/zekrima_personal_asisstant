name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Windows crate
        working-directory: zekrima-windows
        run: cargo test --all-targets
      - name: Build Windows release
        working-directory: zekrima-windows
        run: cargo build --release
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path zekrima-windows/target/release/zekrima.exe, zekrima-windows/README.md -DestinationPath zekrima-windows-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: zekrima-windows-portable
          path: zekrima-windows-portable.zip

  build-arch-linux:
    name: Build Arch Linux / CachyOS (x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust cargo pkgconf \
            gtk4 gtk4-layer-shell pango cairo gdk-pixbuf2
      - uses: actions/checkout@v4
      - name: Check Linux crate
        working-directory: zekrima-arch-linux
        run: |
          set -o pipefail
          if ! cargo test --all-targets --message-format=short 2>&1 | tee /tmp/linux-build.log; then
            grep -E "error(\[E[0-9]+\])?:" /tmp/linux-build.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Build Linux release
        working-directory: zekrima-arch-linux
        run: cargo build --release
      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zekrima-arch-linux-binary
          path: zekrima-arch-linux/target/release/zekrima

  build-android:
    name: Build Android APK (API 29-36)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        working-directory: zekrima-android
        run: chmod +x gradlew
      - name: Run Android unit tests & release APK build
        working-directory: zekrima-android
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zekrima-android-apk
          path: zekrima-android/app/build/outputs/apk/release/app-release.apk
